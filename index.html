<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 活动雷达 · 在时间截止前找到 AI 机会</title>
<meta name="description" content="精选黑客松、积分、资助、挑战和活动机会，在时间截止前找到属于你的 AI 机会。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;780;810&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f7f3ea;
    --surface:#fffdf8d1;
    --surface-strong:#fffdfa;
    --line:#17191d21;
    --line-strong:#17191d33;
    --ink:#17191d;
    --muted:#686b67;
    --teal:#087270;
    --teal-dark:#075958;
    --teal-soft:#d7eeee;
    --amber:#d96f16;
    --amber-soft:#fff0cf;
    --orange:#c2620a;
    --radius:8px;
    --shadow-soft:0 8px 26px #21241f14;
    --shadow:0 18px 54px #21241f1c;
    --font:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--paper);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}
  svg{display:block}
  .wrap{width:min(100% - 40px,1180px);margin:0 auto}

  /* ---------- Site Nav ---------- */
  .site-nav{
    position:sticky;top:0;z-index:30;
    border-bottom:1px solid var(--line);
    background:#f8f4ece0;
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    min-height:78px;
    padding:0 clamp(20px,6vw,112px);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  }
  .brand-mark{display:inline-flex;align-items:center;gap:14px;font-size:22px;font-weight:780}
  .brand-mark b{font-size:15px;font-weight:620;color:var(--muted)}
  .atlas-logo{
    border:2px solid var(--teal);border-radius:50%;
    width:34px;height:34px;position:relative;flex:none;
    background:linear-gradient(135deg,#0d817f,#08605f);
  }
  .atlas-logo:after,.atlas-logo:before{
    content:"";border:1.5px solid #fff;position:absolute;inset:7px;transform:rotate(45deg);opacity:.85;
  }
  .site-nav nav{display:flex;align-items:center;gap:clamp(18px,3vw,38px);font-size:15px;font-weight:620;justify-content:center}
  .site-nav nav a{color:var(--ink);opacity:.78;transition:opacity .15s}
  .site-nav nav a:hover{opacity:1}
  .nav-tools{display:flex;justify-content:flex-end;align-items:center;gap:12px}
  .update-pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:620;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);
  }
  .amber-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
  .gh-link{
    display:inline-flex;align-items:center;gap:7px;
    font-size:13px;font-weight:700;color:#fff;
    background:linear-gradient(#0d817f,#08605f);
    border:1px solid #0000;border-radius:7px;padding:8px 14px;transition:transform .15s,box-shadow .15s;
  }
  .gh-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-soft)}

  /* ---------- Hero ---------- */
  .home-hero{
    position:relative;border-bottom:1px solid var(--line);
    text-align:center;min-height:320px;padding:54px 24px 30px;overflow:hidden;
  }
  .hero-grid-bg{
    pointer-events:none;position:absolute;inset:0;
    background:
      linear-gradient(115deg,#0000 0 36%,#08727009 36.2% 36.4%,#0000 36.6%),
      linear-gradient(30deg,#0000 0 62%,#d96f1608 62.2% 62.5%,#0000 62.8%),
      radial-gradient(120% 80% at 50% -10%,#ffffff55,transparent 60%);
  }
  .hero-inner{position:relative;width:min(980px,100vw - 32px);margin:0 auto}
  .home-hero h1{
    letter-spacing:-.01em;max-width:1180px;margin:0 auto 14px;
    font-size:clamp(36px,4.4vw,52px);font-weight:810;line-height:1.04;color:var(--ink);
  }
  .hero-copy{color:var(--muted);margin:0 auto 24px;font-size:17px;line-height:1.5}

  /* search box */
  .search-box{
    display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px;
    width:min(720px,100%);min-height:62px;margin:0 auto;
    border:1px solid var(--line-strong);border-radius:var(--radius);
    background:#fffdf8e6;box-shadow:var(--shadow-soft);padding:8px 8px 8px 20px;
  }
  .search-box svg{width:22px;height:22px;color:var(--teal)}
  .search-box input{
    border:0;outline:0;background:transparent;font-size:16px;font-family:inherit;color:var(--ink);width:100%;
  }
  .search-box input::placeholder{color:#9a9c97}
  .search-btn{
    border:0;cursor:pointer;color:#fff;font-family:inherit;font-weight:750;font-size:15px;
    background:linear-gradient(#0d817f,#08605f);border-radius:7px;min-height:46px;padding:0 22px;transition:transform .15s;
  }
  .search-btn:hover{transform:translateY(-1px)}

  /* hero chips (quick filters) */
  .hero-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
  .chip{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);
    color:var(--ink);font-family:inherit;font-size:14px;font-weight:640;
    border-radius:999px;padding:9px 16px;transition:all .15s;
  }
  .chip:hover{border-color:var(--teal)}
  .chip.active{background:var(--teal);border-color:var(--teal);color:#fff}

  /* ---------- Sections ---------- */
  main{padding:38px 0 60px}
  .section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:14px 0 18px}
  .section-heading-label{display:flex;align-items:flex-start;gap:12px}
  .section-heading .ico{
    width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;
    background:var(--amber-soft);color:var(--orange);
  }
  .section-heading h2{font-size:24px;font-weight:790;letter-spacing:-.01em;line-height:1.15}
  .section-heading .sub{font-size:13px;color:var(--muted);margin-top:3px}
  .count{font-size:14px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--teal-dark);font-weight:780}

  /* closing-soon grid */
  .deadline-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:46px}
  .deadline-card{
    display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    box-shadow:var(--shadow-soft);padding:14px;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s;
  }
  .deadline-card:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:var(--shadow)}
  .deadline-card .dl-icon{
    width:84px;height:84px;border-radius:9px;object-fit:cover;background:#0c302f;
  }
  .dl-body{min-width:0;display:flex;align-items:center;min-height:84px}
  .dl-body h3{font-size:15.5px;font-weight:760;line-height:1.28;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-right:64px}
  .deadline-badge{
    position:absolute;top:10px;right:10px;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    background:var(--amber-soft);color:#be570f;border:1px solid #d96f1633;
    border-radius:7px;min-height:28px;padding:0 10px;font-size:12.5px;font-weight:780;
    box-shadow:0 2px 6px #d96f1620;letter-spacing:.02em;
  }
  .deadline-badge svg{width:14px;height:14px}
  .deadline-badge.urgent{color:#fff;background:#dd3d18;border-color:#dd3d18;box-shadow:0 2px 8px #dd3d1838}
  .opportunity-card > .deadline-badge{top:108px;right:14px}

  /* ---------- Filter ribbon ---------- */
  .smart-filter-ribbon{
    display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-strong);
    box-shadow:var(--shadow-soft);padding:10px;margin-bottom:22px;
  }
  .filter-trigger{
    position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    border:1px solid var(--line);background:#fffdf8e6;border-radius:7px;
    min-height:46px;padding:0 14px;font-family:inherit;font-size:14px;font-weight:640;color:var(--ink);
    transition:background .15s,border-color .15s;
  }
  .filter-trigger:hover{background:#0872700d;border-color:var(--teal)}
  .filter-trigger .caret{color:var(--muted);font-size:11px}
  .filter-trigger .val{color:var(--teal-dark);font-weight:720}
  .reset-filter{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    border:0;background:transparent;color:var(--teal);font-family:inherit;font-size:14px;font-weight:760;padding:0 12px;
  }
  .reset-filter:hover{text-decoration:underline}
  .filter-group{position:relative;display:inline-flex}
  .filter-menu{
    position:absolute;top:calc(100% + 6px);left:0;z-index:40;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-strong);
    box-shadow:var(--shadow);min-width:200px;padding:6px;list-style:none;
  }
  .filter-menu button{
    width:100%;text-align:left;background:0 0;border:0;border-radius:6px;
    padding:10px 12px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  }
  .filter-menu button:hover{background:#0872700d}
  .filter-menu button.sel{color:var(--teal-dark);font-weight:720}
  .filter-menu button.sel::after{content:"✓";color:var(--teal)}

  /* ---------- Opportunity grid ---------- */
  .opportunity-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .opportunity-card{
    display:flex;flex-direction:column;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    box-shadow:var(--shadow-soft);overflow:hidden;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s;
  }
  .opportunity-card:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:var(--shadow)}
  .card-body{display:flex;flex-direction:column;flex:1;min-height:0;padding:14px 18px 14px}
  .card-main{flex:1;min-height:0}
  .card-main h3{font-size:18px;font-weight:780;line-height:1.22;margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vendor-line{display:flex;align-items:center;gap:6px;color:#2f3333;font-size:13.5px;font-weight:600;margin-bottom:8px}
  .vendor-line svg{width:14px;height:14px;color:var(--teal)}
  .meta-line{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:9px;font-size:12.5px;color:#3a3d3a}
  .meta-line span{display:inline-flex;align-items:center;gap:5px}
  .meta-line svg{width:14px;height:14px;color:var(--muted)}
  .score-line{display:inline-flex;align-items:center;gap:7px;font-size:13px;letter-spacing:.02em;flex-shrink:0}
  .score-line .score-label{font-size:12px;font-weight:720;color:#3a3d3a}
  .score-line .stars{display:inline-flex;gap:1px}
  .stars .filled{color:#d97706}
  .stars .empty{color:#d8d2c8}
  .meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:9px}
  .meta-row .deadline-line{margin-bottom:0}
  .deadline-line{display:inline-flex;align-items:center;gap:6px;margin-bottom:9px;font-size:12.5px;color:#3a3d3a;font-weight:600}
  .deadline-line svg{width:14px;height:14px;color:var(--teal)}
  .deadline-line .long-term{color:var(--muted);font-weight:540}
  .score-diff-row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 14px;margin-bottom:9px}
  .score-diff-row .diff-line{margin-bottom:0;flex:1;min-width:180px}
  .diff-line{display:inline-flex;align-items:flex-start;gap:8px;font-size:13px;letter-spacing:.02em;line-height:1.4}
  .diff-line .diff-note{flex:1;min-width:0;line-height:1.4}
  .summary{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:11px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .reward-box{
    display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;
    border:1px solid var(--line);background:#fffdf880;border-radius:7px;padding:9px 11px;margin-bottom:12px;
  }
  .reward-box svg{width:18px;height:18px;color:var(--teal);margin-top:1px}
  .reward-content{min-width:0}
  .reward-box b{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4;word-break:break-word}
  .reward-box small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.4}
  .card-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:12px}
  .type-tag{
    display:inline-flex;align-items:center;background:var(--teal-soft);color:var(--teal-dark);
    border:1px solid #08727047;border-radius:5px;min-height:26px;padding:0 10px;font-size:13px;font-weight:820;
  }

  .empty-state{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:15px}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--line);background:#f8f4ece0;padding:30px 0 40px;margin-top:20px}
  .foot-inner{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center;color:var(--muted);font-size:13px}
  .foot-inner a{color:var(--teal-dark);font-weight:640}

  /* ---------- Responsive ---------- */
  @media (max-width:1000px){
    .deadline-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .opportunity-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:680px){
    .site-nav{grid-template-columns:1fr auto;gap:10px}
    .site-nav nav{display:none}
    .deadline-grid{grid-template-columns:1fr}
    .opportunity-grid{grid-template-columns:1fr}
    .opportunity-card{display:flex;flex-direction:column}
    .search-box{grid-template-columns:26px 1fr;padding:8px 10px 8px 16px}
    .search-btn{grid-column:1/-1}
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="brand-mark">
    <span class="atlas-logo"></span>
    <span>AI 活动雷达</span>
  </div>
  <nav>
    <a href="#opportunities">全部机会</a>
    <a href="#closing">即将截止</a>
    <a href="#opportunities">分类</a>
  </nav>
  <div class="nav-tools">
    <span class="update-pill"><span class="amber-dot"></span> 更新于 <span id="updatedAt">—</span></span>
    <a class="gh-link" href="https://github.com/hope0719/ai-activity-radar" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
      GitHub
    </a>
  </div>
</header>

<section class="home-hero">
  <div class="hero-grid-bg"></div>
  <div class="hero-inner">
    <h1>在时间截止前找到 AI 机会</h1>
    <p class="hero-copy">精选黑客松、积分、资助、挑战和活动机会</p>
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜索黑客松、积分、资助、奖金…" />
      <button class="search-btn" id="searchBtn" type="button">搜索</button>
    </label>
    <div class="hero-chips" id="quickChips">
      <button class="chip active" data-quick="all">全部机会</button>
      <button class="chip" data-quick="closing">即将截止</button>
      <button class="chip" data-quick="longterm">长期有效</button>
    </div>
  </div>
</section>

<main class="wrap">
  <section id="closing">
    <div class="section-heading deadline-heading">
      <div class="section-heading-label">
        <span class="ico">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-1 4-1 6a3 3 0 0 0 6 0c0-1-.5-2-1-3 2 1 4 3 4 6a7 7 0 1 1-14 0c0-3 2-5 4-7 1 1 1 2 2 4 1-2 1-4 0-6z"/></svg>
        </span>
        <div>
          <h2>即将截止</h2>
          <div class="sub">距离报名通道关闭最近的机会</div>
        </div>
      </div>
    </div>
    <div class="deadline-grid" id="deadlineGrid"></div>
  </section>

  <section id="opportunities">
    <div class="section-heading">
      <div class="section-heading-label">
        <span class="ico" style="background:var(--teal-soft);color:var(--teal-dark)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>
        </span>
        <div>
          <h2>全部机会</h2>
          <div class="sub">已自动隐藏截止超过 7 天的活动</div>
        </div>
      </div>
      <span class="count">共 <b id="listCount">0</b> 条结果</span>
    </div>

    <div class="smart-filter-ribbon">
      <div class="filter-group">
        <button class="filter-trigger" data-filter="type">类型 <span class="val" id="typeVal">全部</span> <span class="caret">▾</span></button>
        <ul class="filter-menu" id="typeMenu" hidden></ul>
      </div>
      <div class="filter-group">
        <button class="filter-trigger" data-filter="region">地区 <span class="val" id="regionVal">全部</span> <span class="caret">▾</span></button>
        <ul class="filter-menu" id="regionMenu" hidden></ul>
      </div>
      <div class="filter-group">
        <button class="filter-trigger" data-filter="sort">排序 <span class="val" id="sortVal">截止日期</span> <span class="caret">▾</span></button>
        <ul class="filter-menu" id="sortMenu" hidden></ul>
      </div>
      <button class="reset-filter" id="resetBtn">重置筛选</button>
    </div>

    <div class="opportunity-grid" id="grid"></div>
  </section>
</main>

<footer>
  <div class="wrap foot-inner">
    <div>AI 活动雷达 · 数据来源开源项目 <a href="https://github.com/JS-banana/ai-opportunity-radar" target="_blank" rel="noopener">ai-opportunity-radar</a>（airadar.laifuyou.com 同源）· 已过滤过期 7 天以上活动</div>
    <div>© 2026 · 部署于 <a href="https://github.com/hope0719/ai-activity-radar" target="_blank" rel="noopener">GitHub Pages</a></div>
  </div>
</footer>

<script>
const CUTOFF_MS = 7 * 86400000;
const NOW = Date.now();

const state = { search:'', type:'all', region:'all', sort:'deadline', quick:'all' };
let ALL = [];

const TYPE_OPTIONS = ['黑客松','开发挑战','AI 竞赛','权益福利','开发激励','内容创作','内测资格','其他'];
const REGION_OPTIONS = ['全球','中国','北美','亚太','欧洲','日本','其他'];
const SORT_OPTIONS = [
  {v:'deadline', t:'截止日期'},
  {v:'score', t:'推荐指数'},
  {v:'reward', t:'奖金池'},
  {v:'newest', t:'最新发现'}
];

// 中文枚举 → 样式类
const OFF_CLASS = {'官方确认':'confirmed','待确认':'suspected','非官方':'unofficial'};
const SUG_CLASS = {'立即行动':'act-now','值得参加':'worth-doing','先关注':'watch','跳过':'skip'};

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function asset(img){ return 'assets/' + (img || 'path-prize-envelope.png'); }

function parseDate(s){
  if(!s) return null;
  const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}
function endOf(a){ return a.endAt || a.deadline_date; }
function daysLeft(a){
  const s = endOf(a); if(!s) return null;
  const d = new Date(s); if(isNaN(d.getTime())) return null;
  return Math.ceil((d.getTime() - NOW) / 86400000);
}
function deadlineBadge(a){
  const s = endOf(a);
  if(!s) return '<span class="deadline-badge">长期开放</span>';
  const n = daysLeft(a);
  if(n === null) return '<span class="deadline-badge">长期开放</span>';
  if(n < 0) return '<span class="deadline-badge urgent">已结束</span>';
  const urgent = n <= 7 ? ' urgent' : '';
  let txt = n === 0 ? '今天截止' : n + ' 天截止';
  return `<span class="deadline-badge${urgent}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${txt}</span>`;
}
function stars(n){
  n = Math.max(0, Math.min(5, n|0));
  let h = '';
  for(let i=0;i<5;i++) h += `<span class="${i<n?'filled':'empty'}">★</span>`;
  return `<span class="stars">${h}</span>`;
}
function rewardVal(a){
  const t = a.reward || '';
  const m = t.match(/[¥$]?\s*([\d,\.]+)\s*(万|亿|k|K|M|万|元|美元|RMB|CNY)?/);
  if(!m) return 0;
  let v = parseFloat(m[1].replace(/,/g,'')) || 0;
  const u = (m[2]||'').toLowerCase();
  if(u.includes('万')) v *= 10000;
  else if(u.includes('亿')) v *= 1e8;
  else if(u==='k') v *= 1000;
  else if(u==='m') v *= 1e6;
  return v;
}

function matches(a){
  if(state.search){
    const q = state.search.toLowerCase();
    if(!(`${a.title} ${a.vendor} ${a.reward} ${a.rewardDetail||''} ${a.type} ${a.region} ${a.officialStatus||''} ${a.suggestion||''}`).toLowerCase().includes(q)) return false;
  }
  if(state.type !== 'all' && a.type !== state.type) return false;
  if(state.region !== 'all' && a.region !== state.region) return false;
  if(state.quick === 'online'){
    const online = a.region === '线上' || (a.format && a.format.includes('线上'));
    if(!online) return false;
  }
  if(state.quick === 'reward' && !a.reward) return false;
  if(state.quick === 'longterm' && endOf(a)) return false;
  if(state.quick === 'closing'){
    const n = daysLeft(a);
    if(n === null || n < 0 || n > 14) return false;
  }
  // 过期>7天不显示（按 endAt 精确时刻，动态随当前时间生效）
  const s = endOf(a);
  if(s){ const d = new Date(s); if(!isNaN(d.getTime()) && (NOW - d.getTime()) > CUTOFF_MS) return false; }
  return true;
}
function sortList(list){
  const s = state.sort;
  if(s === 'score') return list.sort((x,y)=> (y.score||0)-(x.score||0));
  if(s === 'reward') return list.sort((x,y)=> rewardVal(y)-rewardVal(x));
  if(s === 'newest') return list.sort((x,y)=> (y.discoveredAt||'').localeCompare(x.discoveredAt||''));
  return list.sort((x,y)=>{
    const dx = endOf(x)?new Date(endOf(x)).getTime():Infinity;
    const dy = endOf(y)?new Date(endOf(y)).getTime():Infinity;
    return dx - dy;
  });
}

function fmtDate(a){
  const s = endOf(a); if(!s) return '长期开放';
  const d = new Date(s); if(isNaN(d.getTime())) return '';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function oppCard(a){
  const diffLine = a.difficulty ? `<div class="diff-line"><span class="score-label">难度</span>${stars(a.difficulty)}${a.difficultyNote?`<span class="diff-note">${esc(a.difficultyNote)}</span>`:''}</div>` : '';
  const chips = (a.rewardTypes && a.rewardTypes.length) ? `<div class="reward-chips">${a.rewardTypes.map(r=>`<span class="reward-chip">${esc(r)}</span>`).join('')}</div>` : '';
  const off = a.officialStatus ? `<span class="official-badge ${OFF_CLASS[a.officialStatus]||''}">${esc(a.officialStatus)}</span>` : '';
  const sug = a.suggestion ? `<span class="suggest-tag ${SUG_CLASS[a.suggestion]||''}">${esc(a.suggestion)}</span>` : '';
  const badges = (off || sug) ? `<div class="badge-row">${off}${sug}</div>` : '';
  // 去重 ①: 奖励盒只显示一份最完整的奖励文本
  //  - 上游 snapshot.json 把 reward 截断到 80 字符，rewardDetail 是完整版（rewardDetail.startsWith(reward) 占 48 张，113 张完全相同）
  //  - 优先取 rewardDetail（更长更完整），rewardDetail 不存在才回退到 reward
  //  - 取消 small 双层结构，b 直接展示完整版，避免"截断 b + 全文 small"视觉重叠
  const rewardShown = a.rewardDetail || a.reward || '';
  const detail = null;
  // 去重 ②: 摘要只用 participation（参与方式/规则），不再 fallback 到 rewardDetail / difficultyNote（避免与上方奖励盒 / 难度行重复）
  const sum = a.participation || '';
  // 厂商 + 地区合并到一行
  const vendor = (a.vendor && a.vendor !== '其他' && a.vendor !== 'Unknown') ? esc(a.vendor) : '';
  const region = a.region ? esc(a.region) : '';
  const meta = [vendor, region].filter(Boolean).join(' · ');
  return `<a class="opportunity-card" href="${esc(a.url)}" target="_blank" rel="noopener">
    <div class="card-body">
      <div class="card-main">
        <h3>${esc(a.title)}</h3>
        ${meta ? `<p class="vendor-line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>${meta}</p>` : ''}
        <div class="meta-row">${endOf(a) ? `<span class="deadline-line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>${esc(fmtDate(a))} 截止</span>` : `<span class="deadline-line long-term">长期开放</span>`}${off}${sug}${chips}</div>
        <div class="score-diff-row"><span class="score-line"><span class="score-label">推荐</span>${stars(a.score)}</span><span class="diff-line"><span class="score-label">难度</span>${stars(a.difficulty)}</span>${a.difficultyNote?`<span class="diff-note">${esc(a.difficultyNote)}</span>`:''}</div>
        ${a.reward || a.rewardDetail ? `<div class="reward-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-4-6 4 1.5-7L2 9.5 9 9z"/></svg><div class="reward-content"><b>${esc(rewardShown)}</b>${detail ? `<small>${esc(detail)}</small>` : ''}</div></div>` : ''}
        ${sum ? `<p class="summary">${esc(sum)}</p>` : ''}
      </div>
      <div class="card-footer">
        <span class="type-tag">${esc(a.type || '其他')}</span>
      </div>
    </div>
    ${deadlineBadge(a)}
  </a>`;
}

function renderDeadline(){
  const list = ALL.filter(a=>{
    const s = endOf(a); if(!s) return false;
    const d = new Date(s); if(isNaN(d.getTime())) return false;
    if(d.getTime() < NOW) return false;              // 即将截止只展示未结束的
    return true;
  }).sort((x,y)=>{
    const dx = endOf(x)?new Date(endOf(x)).getTime():Infinity;
    const dy = endOf(y)?new Date(endOf(y)).getTime():Infinity;
    return dx - dy;
  }).slice(0,4);
  document.getElementById('deadlineGrid').innerHTML = list.length ? list.map(a=>`
    <a class="deadline-card" href="${esc(a.url)}" target="_blank" rel="noopener">
      <img class="dl-icon" src="${asset(a.image)}" alt="" loading="lazy"/>
      <div class="dl-body">
        <h3>${esc(a.title)}</h3>
      </div>
      ${deadlineBadge(a)}
    </a>`).join('') : '<div class="empty-state">暂无即将截止的活动</div>';
}

function renderList(){
  const list = sortList(ALL.filter(matches));
  document.getElementById('listCount').textContent = list.length;
  const grid = document.getElementById('grid');
  grid.innerHTML = list.length ? list.map(oppCard).join('') : '<div class="empty-state">没有符合条件的活动，试试调整筛选条件。</div>';
}

function buildMenus(){
  const tm = document.getElementById('typeMenu');
  tm.innerHTML = ['全部',...TYPE_OPTIONS].map(t=>`<li><button data-v="${t}" class="${state.type===t?'sel':''}">${t}</button></li>`).join('');
  const rm = document.getElementById('regionMenu');
  rm.innerHTML = ['全部',...REGION_OPTIONS].map(r=>`<li><button data-v="${r}" class="${state.region===r?'sel':''}">${r}</button></li>`).join('');
  const sm = document.getElementById('sortMenu');
  sm.innerHTML = SORT_OPTIONS.map(o=>`<li><button data-v="${o.v}" class="${state.sort===o.v?'sel':''}">${o.t}</button></li>`).join('');
}

function closeMenus(){
  ['typeMenu','regionMenu','sortMenu'].forEach(id=>document.getElementById(id).hidden = true);
}

function bindUI(){
  document.getElementById('searchInput').addEventListener('input', e=>{ state.search = e.target.value.trim(); renderList(); });
  document.getElementById('searchBtn').addEventListener('click', ()=>renderList());

  // quick chips
  document.querySelectorAll('#quickChips .chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#quickChips .chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.quick = btn.dataset.quick;
      renderList();
    });
  });

  // filter triggers (dropdowns)
  document.querySelectorAll('.filter-trigger').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const key = btn.dataset.filter;
      const menu = document.getElementById(key+'Menu');
      const willOpen = menu.hidden;
      closeMenus();
      menu.hidden = !willOpen;
    });
  });
  document.querySelectorAll('.filter-menu').forEach(menu=>{
    menu.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      e.stopPropagation();
      const key = menu.id.replace('Menu','');
      const v = b.dataset.v;
      if(key==='type'){ state.type=v; document.getElementById('typeVal').textContent=v; }
      if(key==='region'){ state.region=v; document.getElementById('regionVal').textContent=v; }
      if(key==='sort'){ state.sort=v; document.getElementById('sortVal').textContent=SORT_OPTIONS.find(o=>o.v===v).t; }
      menu.hidden = true;
      buildMenus();
      renderList();
    });
  });
  document.addEventListener('click', closeMenus);

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    state.type='all'; state.region='all'; state.sort='deadline'; state.quick='all';
    document.getElementById('typeVal').textContent='全部';
    document.getElementById('regionVal').textContent='全部';
    document.getElementById('sortVal').textContent='截止日期';
    document.querySelectorAll('#quickChips .chip').forEach(b=>b.classList.toggle('active', b.dataset.quick==='all'));
    buildMenus(); renderList();
  });
}

async function init(){
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    const data = await res.json();
    ALL = data.activities || [];
    document.getElementById('updatedAt').textContent = (data.updated_at||'').slice(0,10);
  }catch(e){
    document.getElementById('grid').innerHTML = '<div class="empty-state">数据加载失败，请检查 data.json</div>';
    return;
  }
  buildMenus();
  bindUI();
  renderDeadline();
  renderList();
}
init();
</script>
</body>
</html>
