<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 活动雷达 — 在时间截止前找到 AI 机会</title>
<meta name="description" content="精选黑客松、积分、资助、挑战和活动机会。在时间截止前找到 AI 机会。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root {
    --paper: #f8f4ec;
    --paper-2: #f4efe6;
    --surface: #fffdf8;
    --surface-strong: #ffffff;
    --ink: #21241f;
    --muted: #6b6f66;
    --line: #e7e2d8;
    --line-strong: #d8d2c8;
    --teal: #087270;
    --teal-dark: #075e5c;
    --teal-soft: #e4f2f0;
    --amber: #d96f16;
    --amber-soft: #fdeed9;
    --amber-dark: #be570f;
    --red: #dd3d18;
    --red-soft: #fff0e9;
    --radius: 12px;
    --shadow-soft: 0 1px 3px rgba(33,36,31,.05), 0 6px 20px rgba(33,36,31,.05);
    --shadow: 0 22px 52px rgba(8,114,112,.12), 0 10px 28px rgba(33,36,31,.06);
    --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--paper);
    background-image:
      radial-gradient(circle at 18% 10%, #ffffffd1 0%, transparent 28%),
      radial-gradient(circle at 88% 18%, #08727012 0%, transparent 25%),
      linear-gradient(var(--paper), var(--paper-2));
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* 背景网格纹理 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: .46;
    background-image:
      linear-gradient(#17191d0b 1px, transparent 0),
      linear-gradient(90deg, #17191d0b 1px, transparent 0);
    background-size: 48px 48px;
  }
  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* ===== 顶部导航 ===== */
  header.site-nav {
    position: sticky; top: 0; z-index: 50;
    background: #f8f4ece0;
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; min-height: 72px;
    max-width: 1120px; margin: 0 auto; padding: 0 24px;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; text-decoration: none; color: var(--ink); }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--teal), #0b8a86);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.05rem; box-shadow: 0 4px 12px rgba(8,114,112,.35);
  }
  .nav-links { display: flex; gap: 28px; justify-content: center; font-size: 14px; font-weight: 620; }
  .nav-links a { text-decoration: none; color: var(--ink); opacity: .75; transition: opacity .15s; }
  .nav-links a:hover { opacity: 1; }
  .nav-links a.active { color: var(--teal-dark); opacity: 1; }
  .nav-tools { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .nav-tools .update-time { font-size: 12px; color: var(--muted); }
  .nav-tools .gh-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--teal-dark); text-decoration: none;
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 10px;
    background: var(--surface); transition: all .15s;
  }
  .nav-tools .gh-link:hover { border-color: var(--teal); }

  /* ===== Hero ===== */
  .home-hero { padding: 72px 0 56px; text-align: center; position: relative; }
  .home-hero h1 {
    font-size: 2.7rem; font-weight: 820; letter-spacing: -.02em;
    line-height: 1.25; margin-bottom: 14px;
  }
  .home-hero .hero-copy { color: var(--muted); font-size: 17px; margin-bottom: 28px; }
  .search-box {
    max-width: 560px; margin: 0 auto 22px;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 12px; padding: 12px 18px;
    box-shadow: var(--shadow-soft);
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(8,114,112,.12); }
  .search-box svg { color: var(--muted); flex-shrink: 0; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; font-family: var(--font); color: var(--ink);
  }
  .search-box input::placeholder { color: #a8a499; }
  .chip-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 16px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line-strong);
    font-size: 13px; font-weight: 620; color: var(--muted);
    cursor: pointer; transition: all .18s; font-family: var(--font);
  }
  .chip:hover { border-color: var(--teal); color: var(--teal-dark); }
  .chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.amber { background: var(--amber); }
  .dot.teal { background: var(--teal); }
  .dot.purple { background: #7c3aed; }
  .dot.green { background: #5c7a00; }

  /* ===== Section ===== */
  .section-head {
    display: flex; align-items: center; gap: 10px;
    margin: 48px 0 20px;
  }
  .section-head .heading-icon {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--teal-soft); color: var(--teal);
  }
  .section-head h2 { font-size: 1.35rem; font-weight: 800; }
  .section-head .count { margin-left: auto; color: var(--muted); font-size: 13px; }

  /* ===== 即将截止卡片 ===== */
  .deadline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
  }
  .deadline-card {
    display: flex; align-items: flex-start; gap: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
    text-decoration: none; color: inherit;
    box-shadow: var(--shadow-soft); position: relative;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .deadline-card:hover {
    border-color: #0872706b;
    transform: translateY(-3px);
    box-shadow: 0 14px 34px rgba(8,114,112,.14), 0 6px 18px rgba(33,36,31,.06);
  }
  .deadline-card img {
    width: 64px; height: 64px; border-radius: 8px;
    object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .deadline-card h3 { font-size: 1.02rem; font-weight: 790; line-height: 1.3; margin-bottom: 8px; padding-right: 76px; }
  .deadline-card p { font-size: .82rem; color: var(--muted); line-height: 1.55; }
  .deadline-card .type-tag {
    display: inline-block; margin-bottom: 6px;
    background: var(--teal-soft); color: var(--teal-dark);
    border: 1px solid #08727047; border-radius: 5px;
    padding: 1px 8px; font-size: 11px; font-weight: 820;
  }
  .deadline-badge {
    position: absolute; top: 14px; right: 14px;
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--amber-soft); color: var(--amber-dark);
    border: 1px solid #d96f1633; border-radius: 6px;
    padding: 3px 9px; font-size: 12px; font-weight: 720; white-space: nowrap;
  }
  .deadline-badge.urgent { background: var(--red-soft); color: var(--red); border-color: #dd3d183d; }
  .deadline-badge.overdue { background: #f0efe9; color: #9a978e; border-color: #d8d2c833; }
  .deadline-badge.open { background: var(--teal-soft); color: var(--teal-dark); border-color: #08727033; }

  /* ===== 全部机会 ===== */
  .opportunity-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }
  .opportunity-card {
    display: grid; grid-template-columns: 174px 1fr;
    min-height: 214px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
    text-decoration: none; color: inherit; overflow: hidden;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .opportunity-card:hover {
    border-color: #0872706b;
    transform: translateY(-5px);
    box-shadow: var(--shadow);
  }
  .card-media {
    background: #0c302f; position: relative;
    margin: 14px; border-radius: 7px; overflow: hidden;
    min-height: 170px;
  }
  .card-media img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .card-media::after {
    content: ""; position: absolute; inset: 0; z-index: 1;
    opacity: 0; background: linear-gradient(#0872700f, #08727024);
    transition: opacity .2s;
  }
  .opportunity-card:hover .card-media::after { opacity: 1; }
  .card-body {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px 0; position: relative;
  }
  .card-main { flex: 1; min-height: 0; }
  .card-main h3 { font-size: 18px; font-weight: 790; line-height: 1.25; margin: 6px 0 8px; }
  .vendor-line {
    color: #2f3333; display: flex; align-items: center; gap: 8px;
    font-size: 14px; margin-bottom: 12px;
  }
  .vendor-line b { color: var(--teal); font-weight: 760; }
  .meta-line {
    color: #3a3d3a; display: flex; flex-wrap: wrap; align-items: center;
    gap: 12px; margin-bottom: 12px; font-size: 13px;
  }
  .meta-line span { display: inline-flex; align-items: center; gap: 5px; }
  .score-line {
    display: inline-flex; align-items: center; gap: 6px;
    letter-spacing: .02em; font-size: 14px; line-height: 1; margin-bottom: 12px;
  }
  .score-line .score-label { color: var(--muted); margin-right: 2px; }
  .score-line .filled { color: #d97706; }
  .score-line .empty { color: #d8d2c8; }
  .summary {
    color: var(--muted); font-size: 13px; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 0;
  }
  .reward-box {
    margin-top: 10px;
    border: 1px solid var(--line); background: #fffdf880;
    border-radius: 7px; padding: 10px 13px;
    font-size: 13px; color: #3a3d3a;
  }
  .reward-box b { font-weight: 700; }
  .reward-box small { color: var(--muted); font-size: 12px; display: block; margin-top: 3px; }
  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-top: auto; padding-top: 12px;
    font-size: 13px;
  }
  .card-footer-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .type-tag {
    background: var(--teal-soft); color: var(--teal-dark);
    border: 1px solid #08727047; border-radius: 5px;
    min-height: 24px; display: inline-flex; align-items: center;
    padding: 0 9px; font-size: 11px; font-weight: 820; white-space: nowrap;
  }
  .type-tag.amber { background: var(--amber-soft); color: var(--amber-dark); border-color: #d96f1633; }
  .type-tag.purple { background: #ece2fe; color: #6425d0; border-color: #6425d033; }
  .type-tag.blue { background: #e3f0fd; color: #1a5fa8; border-color: #1a5fa833; }
  .type-tag.pink { background: #fce4f2; color: #b82879; border-color: #b8287933; }
  .type-tag.green { background: #f0f8d4; color: #5c7a00; border-color: #5c7a0033; }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center; padding: 56px 20px;
    color: var(--muted);
    background: var(--surface); border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
  }

  /* ===== Footer ===== */
  footer {
    margin-top: 64px; padding: 36px 0;
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13px; text-align: center;
  }
  footer a { color: var(--teal-dark); text-decoration: none; }

  /* ===== 响应式 ===== */
  @media (max-width: 960px) {
    .opportunity-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opportunity-card { grid-template-columns: 1fr; }
    .card-media { min-height: 150px; }
    .card-body { padding: 0 18px 16px; }
  }
  @media (max-width: 640px) {
    .nav-inner { grid-template-columns: 1fr auto; }
    .nav-links { display: none; }
    .home-hero { padding: 48px 0 40px; }
    .home-hero h1 { font-size: 1.8rem; }
    .opportunity-grid { grid-template-columns: 1fr; }
    .deadline-card h3 { padding-right: 0; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="./">
      <span class="logo">📡</span>
      <b>AI 活动雷达</b>
    </a>
    <nav class="nav-links">
      <a class="active" href="#discover">发现</a>
      <a href="#opportunities">全部机会</a>
    </nav>
    <div class="nav-tools">
      <span class="update-time" id="updateTime">数据更新于 -</span>
      <a class="gh-link" href="https://github.com/hope0719/ai-activity-radar" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </div>
</header>

<section class="home-hero" id="discover">
  <div class="container">
    <h1>在时间截止前找到 AI 机会</h1>
    <p class="hero-copy">精选黑客松、积分、资助、挑战和活动机会</p>
    <label class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="搜索黑客松、积分、资助...">
    </label>
    <div class="chip-row">
      <button class="chip active" data-type="all">全部</button>
      <button class="chip" data-type="黑客松"><span class="dot purple"></span>黑客松</button>
      <button class="chip" data-type="开发挑战"><span class="dot teal"></span>开发挑战</button>
      <button class="chip" data-type="AI 竞赛"><span class="dot amber"></span>AI 竞赛</button>
      <button class="chip" data-type="开发激励"><span class="dot green"></span>开发激励</button>
      <button class="chip" data-type="权益福利"><span class="dot pink"></span>权益福利</button>
      <button class="chip" data-type="内容创作"><span class="dot purple"></span>内容创作</button>
    </div>
  </div>
</section>

<main class="container">

  <!-- 即将截止 -->
  <section id="opportunities">
    <div class="section-head">
      <div class="heading-icon">🔥</div>
      <h2>即将截止</h2>
      <span class="count" id="closingCount"></span>
    </div>
    <div class="deadline-grid" id="closingGrid"></div>
  </section>

  <!-- 全部机会 -->
  <section>
    <div class="section-head">
      <div class="heading-icon">📋</div>
      <h2>全部机会</h2>
      <span class="count">共 <b id="listCount">0</b> 条结果</span>
    </div>
    <div class="chip-row" style="justify-content:flex-start; margin-bottom:20px;">
      <span class="chip" data-region="all" style="cursor:default;border-color:var(--teal);color:var(--teal-dark);font-weight:720;">🌍 地区：全部</span>
      <button class="chip" data-region="全球">🌍 全球</button>
      <button class="chip" data-region="中国">🇨🇳 中国</button>
      <button class="chip" data-region="北美">🇺🇸 北美</button>
      <button class="chip" data-region="欧洲">🇪🇺 欧洲</button>
      <button class="chip" data-region="线上">💻 线上</button>
      <button class="chip" data-region="日本">🇯🇵 日本</button>
      <select id="sortSelect" style="
        margin-left:auto; padding:8px 14px; border-radius:999px;
        border:1px solid var(--line-strong); background:var(--surface);
        font-size:13px; font-weight:620; color:var(--muted); outline:none;
        font-family:var(--font); cursor:pointer;
      ">
        <option value="deadline">按截止日期（近 → 远）</option>
        <option value="score">按推荐指数</option>
        <option value="reward">按奖金池</option>
      </select>
    </div>
    <div class="opportunity-grid" id="opportunityGrid"></div>
  </section>

</main>

<footer>
  <div class="container">
    <p>📡 AI 活动雷达 · 数据聚合自公开来源，仅供学习参考 · <a href="https://airadar.laifuyou.com/zh" target="_blank" rel="noopener">原始数据参考</a></p>
    <p style="margin-top:6px; font-size:12px;">参加活动前请以活动主办方官方页面为准 · 已自动过滤过期 7 天以上的活动</p>
  </div>
</footer>

<script>
const TYPE_STYLE = {
  '开发挑战': 'teal', '黑客松': 'purple', 'AI 竞赛': 'amber', 'AI竞赛': 'amber',
  '权益福利': 'pink', '开发激励': 'green', '内容创作': 'purple'
};
const REGION_ICON = { '全球': '🌍', '中国': '🇨🇳', '北美': '🇺🇸', '欧洲': '🇪🇺', '日本': '🇯🇵', '线上': '💻', '亚洲': '🌏' };

let allActivities = [];
let activeType = 'all';
let activeRegion = 'all';

async function loadData() {
  try {
    const res = await fetch('data.json');
    const data = await res.json();
    allActivities = data.activities;
    document.getElementById('updateTime').textContent = '数据更新于 ' + formatTimeAgo(data.updated_at);
    render();
  } catch (e) {
    document.getElementById('opportunityGrid').innerHTML =
      '<div class="empty-state">数据加载失败，请确认 data.json 存在</div>';
  }
}

function formatTimeAgo(iso) {
  if (!iso) return '-';
  const t = new Date(iso);
  const diff = Math.floor((Date.now() - t.getTime()) / 3600000);
  if (diff < 1) return '刚刚';
  if (diff < 24) return diff + ' 小时前';
  return Math.floor(diff / 24) + ' 天前';
}

function calcDeadline(a) {
  const now = new Date();
  if (a.deadline_date) {
    const d = new Date(a.deadline_date + 'T23:59:59+08:00');
    const days = Math.ceil((d - now) / 86400000);
    if (days < 0) return { cls: 'overdue', text: '已过期 ' + Math.abs(days) + ' 天' };
    if (days === 0) return { cls: 'urgent', text: '今天截止' };
    if (days <= 7) return { cls: 'urgent', text: days + ' 天截止' };
    return { cls: '', text: days + ' 天截止' };
  }
  if (a.deadline_text === '长期开放') return { cls: 'open', text: '长期开放' };
  if (a.deadline_text && a.deadline_text.includes('已过期')) return { cls: 'overdue', text: '已过期' };
  return { cls: 'open', text: a.deadline_text || '长期开放' };
}

function stars(a) {
  let s = '';
  for (let i = 0; i < 5; i++) {
    s += `<span class="${i < a.score ? 'filled' : 'empty'}">★</span>`;
  }
  return s;
}

function renderClosing() {
  const grid = document.getElementById('closingGrid');
  const closing = allActivities
    .map(a => ({ a, d: calcDeadline(a) }))
    .filter(x => x.d.cls === 'urgent')
    .sort((x, y) => (x.a.deadline_date || '9999').localeCompare(y.a.deadline_date || '9999'))
    .slice(0, 4);
  document.getElementById('closingCount').textContent = closing.length ? `最近 ${closing.length} 个 · 7 天内截止` : '暂无 7 天内截止的活动';
  grid.innerHTML = closing.map(({ a, d }) => `
    <a class="deadline-card" href="${a.url}" target="_blank" rel="noopener">
      <img src="assets/${a.image || 'path-prize-envelope.png'}" alt="">
      <div>
        <span class="type-tag">${a.type || ''}</span>
        <h3>${a.title}</h3>
        <p>${REGION_ICON[a.region] || ''} ${a.region || ''} · ${a.reward || ''}</p>
      </div>
      <span class="deadline-badge ${d.cls}">⏰ ${d.text}</span>
    </a>
  `).join('');
  if (!closing.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">🔥 近期没有即将截止的活动，看看全部机会</div>';
  }
}

function filtered() {
  return allActivities.filter(a => {
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const matchType = activeType === 'all' || a.type === activeType;
    const matchRegion = activeRegion === 'all' || a.region === activeRegion;
    const matchSearch = !q || (a.title + (a.vendor || '') + (a.reward || '')).toLowerCase().includes(q);
    return matchType && matchRegion && matchSearch;
  });
}

function renderList() {
  let list = filtered();
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'deadline') {
    list.sort((a, b) => (a.deadline_date || '9999').localeCompare(b.deadline_date || '9999'));
  } else if (sort === 'score') {
    list.sort((a, b) => b.score - a.score);
  } else if (sort === 'reward') {
    const rv = t => {
      const m = String(t || '').match(/(\d+(?:\.\d+)?)\s*(万|K|k)/);
      if (!m) return 0;
      return parseFloat(m[1]) * (m[2] === '万' ? 10000 : 1000);
    };
    list.sort((a, b) => rv(b.reward) - rv(a.reward));
  }
  document.getElementById('listCount').textContent = list.length;
  document.getElementById('opportunityGrid').innerHTML = list.map(a => {
    const d = calcDeadline(a);
    return `
    <a class="opportunity-card" href="${a.url}" target="_blank" rel="noopener">
      <div class="card-media">
        <img src="assets/${a.image || 'path-prize-envelope.png'}" alt="">
      </div>
      <div class="card-body">
        <div class="card-main">
          <div class="vendor-line"><b>${a.vendor || '—'}</b></div>
          <h3>${a.title}</h3>
          <div class="meta-line">
            <span>${REGION_ICON[a.region] || '📍'} ${a.region || '—'}</span>
            <span>🗓 ${a.date_text || '长期开放'}</span>
            <span>⏱ ${a.duration || '—'}</span>
          </div>
          <div class="score-line"><span class="score-label">推荐指数</span>${stars(a)}</div>
          <p class="summary">${a.summary || ''}</p>
          <div class="reward-box">
            <b>💰 ${a.reward || ''}</b>
            ${a.source ? `<small>来源：${a.source} · ${a.deadline_date || '长期开放'}</small>` : ''}
          </div>
        </div>
        <div class="card-footer">
          <div class="card-footer-left">
            <span class="type-tag ${TYPE_STYLE[a.type] || ''}">${a.type || ''}</span>
          </div>
          <span class="deadline-badge ${d.cls}">⏰ ${d.text}</span>
        </div>
      </div>
    </a>`;
  }).join('');
  if (!list.length) {
    document.getElementById('opportunityGrid').innerHTML =
      '<div class="empty-state">😕 没有符合条件的机会，换个筛选试试</div>';
  }
}

function render() {
  renderClosing();
  renderList();
}

document.getElementById('searchInput').addEventListener('input', renderList);
document.getElementById('sortSelect').addEventListener('change', renderList);
document.querySelectorAll('.chip[data-type]').forEach(chip => {
  chip.addEventListener('click', () => {
    activeType = chip.dataset.type;
    document.querySelectorAll('.chip[data-type]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderList();
  });
});
document.querySelectorAll('.chip[data-region]').forEach(chip => {
  chip.addEventListener('click', () => {
    if (chip.dataset.region === 'all') return;
    activeRegion = chip.dataset.region;
    document.querySelectorAll('.chip[data-region]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderList();
  });
});

loadData();
</script>
</body>
</html>
